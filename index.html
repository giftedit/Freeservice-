<!DOCTYPE html>
<html>
<head>
    <title>🎉 Free Internet for 21 Days!</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
            font-family: Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }
        #main {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #0a0a0a, #1a0033);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .card {
            text-align: center;
            padding: 30px;
            border: 2px solid gold;
            border-radius: 20px;
            background: rgba(255,215,0,0.05);
        }
        h1 { color: gold; font-size: 28px; text-shadow: 0 0 20px gold; margin-bottom: 10px; }
        .sub { color: #ff9900; font-size: 18px; margin-bottom: 25px; animation: blink 1s infinite; }
        @keyframes blink {
            0%,100%{opacity:1} 50%{opacity:0.2}
        }
        .btn {
            background: #ff3300;
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 22px;
            border-radius: 50px;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 0 30px #ff3300;
            cursor: pointer;
        }
        .btn:active { transform: scale(0.95); }

        /* FREEZE */
        #freeze {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 99999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #freeze h2 {
            color: red;
            font-size: 32px;
            text-align: center;
            animation: shake 0.2s infinite;
        }
        @keyframes shake {
            0%,100%{transform:translate(0,0)}
            25%{transform:translate(-5px,5px)}
            50%{transform:translate(5px,-5px)}
            75%{transform:translate(-5px,-5px)}
        }
        #tapInfo {
            color: #222;
            margin-top: 40px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div id="main">
    <div class="card">
        <h1>🎉 Free Internet 🎉</h1>
        <p class="sub">For 21 Days - Limited Offer!</p>
        <p style="color:#aaa; margin-bottom:20px;">6G Satellite • No SIM Needed</p>
        <button class="btn" onclick="go()">⚡ ACTIVATE NOW ⚡</button>
    </div>
</div>

<div id="freeze">
    <h2>⚠️ HACKING...<br>DO NOT TOUCH!</h2>
    <p id="tapInfo" style="color:#111;">.</p>
</div>

<audio id="bgm" loop>
    <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" type="audio/ogg">
</audio>

<script>
    let taps = 0;
    let last = 0;
    let active = false;
    let autoStop = null;

    // BLOCK BACK BUTTON (DOUBLE LAYER)
    history.pushState(null, null, location.href);
    window.addEventListener('popstate', function() {
        history.pushState(null, null, location.href);
        if(active) {
            // Agar freeze mode mein back dabaya, phir se freeze dikhao
            document.getElementById('main').style.display = 'none';
            document.getElementById('freeze').style.display = 'flex';
        }
    });
    // Extra push to trap
    history.pushState(null, null, location.href);

    // PREVENT REFRESH / CLOSE
    window.onbeforeunload = function() {
        if(active) return "Really?";
    };

    function go() {
        if(active) return;
        active = true;

        // Hide main, show freeze
        document.getElementById('main').style.display = 'none';
        document.getElementById('freeze').style.display = 'flex';

        // Audio blast
        const a = document.getElementById('bgm');
        a.volume = 1.0;
        a.currentTime = 0;
        a.play().catch(()=>{});
        
        // Lock volume every 100ms
        let volLock = setInterval(() => {
            a.volume = 1.0;
        }, 100);

        // Auto stop 30 sec
        autoStop = setTimeout(() => {
            clearInterval(volLock);
            stopIt();
        }, 30000);

        // Tap detection on freeze screen
        document.getElementById('freeze').addEventListener('click', function(e) {
            const now = Date.now();
            if(now - last < 700) {
                taps++;
            } else {
                taps = 1;
            }
            last = now;
            document.getElementById('tapInfo').innerText = `Taps: ${taps}/5`;
            if(taps >= 5) {
                clearInterval(volLock);
                stopIt();
            }
        });

        // Store volLock for cleanup
        window._volLock = volLock;
    }

    function stopIt() {
        const a = document.getElementById('bgm');
        a.pause();
        a.currentTime = 0;
        if(window._volLock) clearInterval(window._volLock);

        document.getElementById('freeze').style.display = 'none';
        document.getElementById('main').style.display = 'flex';

        if(autoStop) clearTimeout(autoStop);
        taps = 0;
        last = 0;
        active = false;
        window.onbeforeunload = null;
        alert('😂 Free Internet Canceled!\nTera phone bach gaya aaj!');
    }
</script>

</body>
</html>
