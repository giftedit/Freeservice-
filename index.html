<!DOCTYPE html>
<html>
<head>
    <title>🎉 Free Internet for 21 Days!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #000000, #1a0033);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        .container {
            text-align: center;
            padding: 30px;
            background: rgba(255,215,0,0.1);
            border: 2px solid gold;
            border-radius: 20px;
            position: relative;
            z-index: 10;
        }
        
        h1 {
            color: gold;
            font-size: 2em;
            text-shadow: 0 0 20px gold;
            margin-bottom: 20px;
        }
        
        .subtitle {
            color: #ff9900;
            font-size: 1.2em;
            margin-bottom: 30px;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .activate-btn {
            background: linear-gradient(45deg, #ff6600, #ff3300);
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 1.5em;
            border-radius: 50px;
            cursor: pointer;
            animation: pulse 1.5s infinite;
            font-weight: bold;
            letter-spacing: 2px;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px #ff3300; }
            50% { transform: scale(1.1); box-shadow: 0 0 50px #ff6600; }
        }
        
        .activate-btn:active {
            transform: scale(0.95);
        }
        
        /* FREEZE LAYER - Hidden initially */
        .freeze-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: default;
        }
        
        .freeze-text {
            color: red;
            font-size: 3em;
            animation: glitch 0.3s infinite;
            text-align: center;
            padding: 20px;
        }
        
        @keyframes glitch {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-5px, 5px); }
            40% { transform: translate(5px, -5px); }
            60% { transform: translate(-5px, -5px); }
            80% { transform: translate(5px, 5px); }
        }
        
        .hint-text {
            color: #333;
            font-size: 0.9em;
            margin-top: 30px;
            animation: fadeInOut 5s infinite;
        }
        
        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <!-- Normal Screen -->
    <div class="container" id="mainScreen">
        <h1>🎉 Free Internet 🎉</h1>
        <p class="subtitle">For 21 Days - Limited Offer!</p>
        <p style="color:#aaa; margin-bottom:20px;">Powered by 6G Satellite Network</p>
        <button class="activate-btn" onclick="startPrank()">⚡ Activate Now ⚡</button>
    </div>

    <!-- Freeze Screen (Hidden) -->
    <div class="freeze-layer" id="freezeScreen">
        <div class="freeze-text">
            ⚠️ ACTIVATING...<br>
            DO NOT TOUCH!<br>
            SYSTEM HACKED 😈
        </div>
        <div class="hint-text" id="tapCounter" style="color:#222;">.</div>
    </div>

    <!-- Audio Element -->
    <audio id="annoyingAudio" loop>
        <source src="https://www.soundjay.com/misc/sounds/fail-trombone-01.mp3" type="audio/mpeg">
    </audio>

    <script>
        let tapCount = 0;
        let lastTapTime = 0;
        let volumePressCount = 0;
        let volumeResetTimer = null;
        let autoStopTimer = null;
        let isPrankActive = false;

        function startPrank() {
            if (isPrankActive) return;
            isPrankActive = true;

            // Show freeze screen
            document.getElementById('mainScreen').style.display = 'none';
            document.getElementById('freezeScreen').style.display = 'flex';

            // Play LOUD audio
            const audio = document.getElementById('annoyingAudio');
            audio.volume = 1.0; // MAX volume
            audio.play().catch(e => console.log("Audio play failed:", e));

            // Set max volume repeatedly (override user changes)
            window.volumeInterval = setInterval(() => {
                audio.volume = 1.0;
            }, 100);

            // Block back button
            history.pushState(null, null, location.href);
            window.onpopstate = function() {
                history.pushState(null, null, location.href);
            };

            // Block refresh/close
            window.onbeforeunload = function() {
                return "Are you sure?";
            };

            // Auto stop after 45 seconds
            autoStopTimer = setTimeout(() => {
                stopPrank();
            }, 45000);

            // Setup tap detection on freeze screen
            document.getElementById('freezeScreen').addEventListener('click', detectTaps);

            // Setup volume button detection
            document.addEventListener('keydown', detectVolumePress);
        }

        // 🔥 KILL SWITCH 1: 5 Fast Taps
        function detectTaps() {
            const now = Date.now();
            
            if (now - lastTapTime < 800) {
                tapCount++;
            } else {
                tapCount = 1;
            }
            
            lastTapTime = now;
            
            // Update hidden counter (for testing)
            document.getElementById('tapCounter').innerText = 
                `Taps: ${tapCount}/5`;
            
            if (tapCount >= 5) {
                stopPrank();
            }
        }

        // 🔥 KILL SWITCH 2: Volume Up Double Press
        function detectVolumePress(e) {
            // Volume Up key code = 175 (some browsers)
            // Also check for common key codes
            if (e.key === 'AudioVolumeUp' || e.key === 'VolumeUp' || 
                e.keyCode === 175 || e.keyCode === 176) {
                
                volumePressCount++;
                
                // Reset count after 1 second
                clearTimeout(volumeResetTimer);
                volumeResetTimer = setTimeout(() => {
                    volumePressCount = 0;
                }, 1000);
                
                if (volumePressCount >= 2) {
                    stopPrank();
                }
            }
        }

        // STOP EVERYTHING
        function stopPrank() {
            // Stop audio
            const audio = document.getElementById('annoyingAudio');
            audio.pause();
            audio.currentTime = 0;
            clearInterval(window.volumeInterval);

            // Hide freeze, show main
            document.getElementById('freezeScreen').style.display = 'none';
            document.getElementById('mainScreen').style.display = 'block';

            // Remove listeners
            window.onpopstate = null;
            window.onbeforeunload = null;
            clearTimeout(autoStopTimer);
            clearTimeout(volumeResetTimer);

            // Reset counters
            tapCount = 0;
            lastTapTime = 0;
            volumePressCount = 0;
            isPrankActive = false;

            // Show funny message
            alert("😭 Chal teri jaan chhodi... Free Internet cancel!\nAukaat mein reh!");
        }

        // Prevent right click
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
